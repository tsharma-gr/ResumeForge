services:
  - type: web
    name: resumeforge-ai-backend
    env: node
    plan: free
    buildCommand: |
      sudo apt-get update && sudo apt-get install -y python3 python3-pip
      pip3 install -r requirements.txt
      npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    autoDeploy: true
